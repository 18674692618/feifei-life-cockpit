<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>飞飞子的生活工作台</title>
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <link rel="manifest" href="./public/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./public/app-icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="生活工作台" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffc928" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <h1 id="appHeaderTitle">生日</h1>
          <p class="header-copy" id="appHeaderCopy">家人生日提醒</p>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="installBtn" type="button" title="安装到桌面" aria-label="安装到桌面" hidden>＋</button>
          <button class="icon-button" id="cloudBtn" type="button" title="云端同步" aria-label="云端同步">☁</button>
          <button class="icon-button" id="privacyBtn" type="button" title="隐藏金额" aria-label="隐藏金额">◐</button>
        </div>
      </header>

      <nav class="module-tabs" aria-label="工作台模块">
        <button class="module-tab" type="button" data-view="fitness" aria-selected="false">
          <svg class="tab-icon" viewBox="0 0 80 64" aria-hidden="true">
            <path class="tab-stroke" d="M22 55c2-18 3-32 6-42 1-4 5-6 10-4 4 2 6 4 8 8 2-5 7-7 12-5 5 2 7 6 8 12l6 31" />
            <path class="tab-stroke" d="M18 55h56M31 28c6 5 14 5 21 0" />
          </svg>
          <span class="tab-label">健身</span>
        </button>
        <button class="module-tab" type="button" data-view="assets" aria-selected="false">
          <svg class="tab-icon" viewBox="0 0 80 64" aria-hidden="true">
            <path class="tab-stroke" d="M17 51V23l23-12 23 12v28" />
            <path class="tab-stroke" d="M27 51V33h26v18M33 23h14M33 42h14" />
            <path class="tab-fill-green" d="M57 16c9 1 14 6 14 14 0 7-5 12-13 13" />
          </svg>
          <span class="tab-label">资产</span>
        </button>
        <button class="module-tab" type="button" data-view="travel" aria-selected="false">
          <svg class="tab-icon" viewBox="0 0 80 64" aria-hidden="true">
            <circle class="tab-fill-yellow" cx="42" cy="32" r="22" />
            <path class="tab-stroke" d="M26 26c8-4 22-4 32 0M31 37c5 7 17 7 23 0" />
            <path class="tab-stroke" d="M20 13c-4-3-7-3-9 1M62 11c5-5 10-5 13 0M34 23l-6-5M50 23l7-5" />
          </svg>
          <span class="tab-label">旅行</span>
        </button>
        <button class="module-tab active" type="button" data-view="dashboard" aria-selected="true">
          <svg class="tab-icon" viewBox="0 0 80 64" aria-hidden="true">
            <path class="tab-fill-yellow" d="M18 34c3-15 14-23 31-23 13 0 22 7 21 18-1 12-13 22-31 22-15 0-24-6-21-17Z" />
            <circle class="tab-fill-blue" cx="35" cy="23" r="12" />
            <path class="tab-stroke" d="M12 18 7 13M17 10l-2-7M62 12l6-6M70 24l8-1M20 50l-6 5" />
          </svg>
          <span class="tab-label">生日</span>
        </button>
      </nav>

      <main>
        <section class="view active" id="dashboardView" data-view-panel="dashboard">
          <section class="birthday-workspace">
            <article class="birthday-home-panel">
              <div class="birthday-filter-row" id="birthdayFilters">
                <button class="birthday-filter active" type="button" data-birthday-filter="all">全部 <span id="birthdayTotalCount">0</span></button>
                <button class="birthday-filter" type="button" data-birthday-filter="家人">家人 <span data-birthday-count="家人">0</span></button>
                <button class="birthday-filter" type="button" data-birthday-filter="朋友">朋友 <span data-birthday-count="朋友">0</span></button>
                <button class="birthday-filter" type="button" data-birthday-filter="同事">同事 <span data-birthday-count="同事">0</span></button>
                <button class="birthday-filter" type="button" data-birthday-filter="同学">同学 <span data-birthday-count="同学">0</span></button>
                <button class="birthday-filter" type="button" data-birthday-filter="亲戚">亲戚 <span data-birthday-count="亲戚">0</span></button>
              </div>
              <label class="birthday-search">
                <span>⌕</span>
                <input id="birthdaySearch" type="search" placeholder="输入姓名搜索..." />
              </label>
              <div class="birthday-summary-strip">
                <div><span>本月生日</span><strong id="birthdayMonthCount">0</strong></div>
                <div><span>最近生日</span><strong id="birthdayNextName">暂无</strong></div>
              </div>
              <div class="birthday-list" id="birthdayList"></div>
              <button class="birthday-fab" id="newBirthdayBtn" type="button" aria-label="新增生日">＋</button>
            </article>

            <div class="birthday-modal is-collapsed" id="birthdayEditor" aria-hidden="true">
              <article class="panel birthday-editor" role="dialog" aria-modal="true" aria-labelledby="birthdayFormTitle">
                <div class="panel-title">
                  <div>
                    <p class="eyebrow">Birthday</p>
                    <h2 id="birthdayFormTitle">新增生日</h2>
                  </div>
                </div>
                <form id="birthdayForm" class="stack-form">
                  <input id="birthdayId" type="hidden" />
                  <div class="profile-field">
                    <span>*姓名</span>
                    <input id="birthdayName" type="text" placeholder="妈妈" required />
                  </div>
                  <div class="profile-field">
                    <span>*生日日期</span>
                    <input id="birthdayDate" type="date" required />
                  </div>
                  <div class="profile-field align-start">
                    <span>*关系</span>
                    <div class="relation-picker">
                      <input id="birthdayRelation" type="hidden" value="家人" />
                      <button class="relation-chip active" type="button" data-relation-value="家人">家人</button>
                      <button class="relation-chip" type="button" data-relation-value="朋友">朋友</button>
                      <button class="relation-chip" type="button" data-relation-value="同事">同事</button>
                      <button class="relation-chip" type="button" data-relation-value="同学">同学</button>
                      <button class="relation-chip" type="button" data-relation-value="亲戚">亲戚</button>
                      <button class="relation-chip" type="button" data-relation-value="伴侣">伴侣</button>
                    </div>
                  </div>
                  <div class="profile-field">
                    <span>备注</span>
                    <input id="birthdayNote" type="text" placeholder="喜欢的礼物、美食、忌口等" />
                  </div>
                  <div class="button-row">
                    <button class="secondary-button" id="cancelBirthdayBtn" type="button">取消</button>
                    <button class="primary-button" type="submit">保存</button>
                  </div>
                </form>
              </article>
            </div>

            <article class="panel sync-panel" id="cloudSyncPanel">
              <div class="panel-title">
                <div>
                  <p class="eyebrow">Cloud</p>
                  <h2>云端保存</h2>
                </div>
              </div>
              <div class="stack-form">
                <label>同步地址<input id="cloudSyncUrl" type="url" placeholder="Google 同步地址" /></label>
                <div class="sync-actions">
                  <button class="primary-button" id="saveCloudUrlBtn" type="button">保存地址</button>
                  <button class="secondary-button" id="uploadCloudBtn" type="button">上传</button>
                  <button class="secondary-button" id="restoreCloudBtn" type="button">恢复</button>
                </div>
                <div class="muted" id="cloudSyncStatus">未配置</div>
              </div>
            </article>
          </section>
        </section>

        <section class="view" id="fitnessView" data-view-panel="fitness">
          <div class="section-head">
            <div>
              <h2>健身</h2>
            </div>
          </div>
          <section class="single-column">
            <section class="content-stack">
              <div class="metric-row">
                <article class="metric-card"><span>当月锻炼天数</span><strong id="fitMonthDays">0</strong></article>
                <article class="metric-card"><span>本周锻炼天数</span><strong id="fitWeekCount">0</strong></article>
                <article class="metric-card"><span>本月爱爱</span><strong id="fitLoveCount">0</strong></article>
              </div>
              <article class="panel fitness-panel">
                <div class="panel-title calendar-title-row">
                  <div>
                    <h3 id="fitnessMonthTitle">训练日历</h3>
                  </div>
                  <div class="calendar-actions">
                    <button class="icon-button small" id="prevFitnessMonth" type="button" aria-label="上个月">‹</button>
                    <button class="icon-button small" id="todayFitnessMonth" type="button" aria-label="回到今天">今</button>
                    <button class="icon-button small" id="nextFitnessMonth" type="button" aria-label="下个月">›</button>
                  </div>
                </div>
                <div class="selected-day-toolbar">
                  <strong id="selectedQuickTitle">今天</strong>
                  <div class="quick-actions">
                    <button class="quick-action" id="toggleWorkoutBtn" type="button">标记健身</button>
                    <button class="quick-action love" id="toggleLoveBtn" type="button">标记爱爱</button>
                  </div>
                </div>
                <div class="fitness-calendar" aria-label="训练日历">
                  <div class="calendar-weekdays">
                    <span>一</span>
                    <span>二</span>
                    <span>三</span>
                    <span>四</span>
                    <span>五</span>
                    <span>六</span>
                    <span>日</span>
                  </div>
                  <div class="calendar-grid" id="fitnessCalendar"></div>
                </div>
              </article>
              <article class="panel">
                <div class="panel-title">
                  <h3 id="selectedWorkoutTitle">当天状态</h3>
                  <button class="text-button" id="clearWorkoutsBtn" type="button">清空记录</button>
                </div>
                <div class="log-list" id="selectedWorkoutList"></div>
              </article>
            </section>
          </section>
        </section>

        <section class="view" id="assetsView" data-view-panel="assets">
          <div class="section-head">
            <div>
              <p class="eyebrow">Monthly money</p>
              <h2>资产：记录每月家庭收入、支出和余额</h2>
            </div>
          </div>
          <section class="asset-layout">
            <aside class="panel form-panel">
              <h3>本月家庭快照</h3>
              <form id="assetForm" class="stack-form">
                <label>月份<input id="assetMonth" type="month" required /></label>
                <div class="field-grid">
                  <label>家庭收入<input id="monthlyIncome" type="number" min="0" placeholder="0" /></label>
                  <label>总支出<input id="monthlyExpense" type="number" min="0" placeholder="0" /></label>
                </div>
                <div class="field-grid">
                  <label>家庭余额<input id="familyBalance" type="number" min="0" placeholder="0" /></label>
                  <label>公积金余额<input id="housingFund" type="number" min="0" placeholder="0" /></label>
                </div>
                <div class="field-grid">
                  <label>负债<input id="monthlyDebt" type="number" min="0" placeholder="0" /></label>
                  <label>理财<input id="investmentBalance" type="number" min="0" placeholder="0" /></label>
                </div>
                <button class="primary-button" type="submit">保存这个月</button>
              </form>
            </aside>
            <section class="content-stack">
              <div class="metric-row">
                <article class="metric-card"><span>本月结余</span><strong class="money-text" id="monthlySurplus">¥0</strong></article>
                <article class="metric-card"><span>家庭总余额</span><strong class="money-text" id="totalBalance">¥0</strong></article>
                <article class="metric-card"><span>净资产</span><strong class="money-text" id="netWorth">¥0</strong></article>
              </div>
              <article class="panel">
                <div class="panel-title">
                  <h3>月度记录</h3>
                  <select id="snapshotMonthFilter" aria-label="查看月份"></select>
                </div>
                <div class="snapshot-grid" id="snapshotGrid"></div>
              </article>
              <article class="panel">
                <div class="panel-title">
                  <h3>近几个月变化</h3>
                </div>
                <div class="asset-bars" id="monthlyTrend"></div>
              </article>
            </section>
          </section>
        </section>

        <section class="view" id="travelView" data-view-panel="travel">
          <div class="section-head">
            <div>
              <p class="eyebrow">Travel timeline</p>
              <h2>旅游：成本、攻略、照片和回忆</h2>
            </div>
            <button class="primary-button compact-button" id="newTripBtn" type="button">新建旅行</button>
          </div>
          <section class="two-column">
            <aside class="panel form-panel is-collapsed" id="tripEditor">
              <h3 id="tripFormTitle">记录一次旅行</h3>
              <form id="tripForm" class="stack-form">
                <input id="tripId" type="hidden" />
                <label>目的地<input id="destination" placeholder="京都、阿勒泰、巴黎" required /></label>
                <div class="field-grid">
                  <label>出发<input id="startDate" type="date" required /></label>
                  <label>回来<input id="endDate" type="date" required /></label>
                </div>
                <div class="field-grid">
                  <label>预算<input id="budget" type="number" min="0" /></label>
                  <label>实际花费<input id="cost" type="number" min="0" required /></label>
                </div>
                <label>成员<input id="companions" placeholder="妈妈、朋友们、自己" /></label>
                <label>攻略<textarea id="guide" rows="3" placeholder="路线、酒店、交通、餐厅、避坑点"></textarea></label>
                <label>回忆<textarea id="memory" rows="3" placeholder="这一趟最想记住的瞬间"></textarea></label>
                <label class="photo-drop">
                  <input id="photos" type="file" accept="image/*" multiple hidden />
                  <span>添加照片</span>
                  <small>照片会保存在本机浏览器数据里</small>
                </label>
                <div id="photoPreview" class="photo-grid"></div>
                <div class="button-row">
                  <button class="primary-button" type="submit">保存旅行</button>
                  <button class="secondary-button" id="resetTripBtn" type="button">清空</button>
                  <button class="secondary-button" id="closeTripBtn" type="button">收起</button>
                </div>
              </form>
            </aside>
            <section class="content-stack">
              <div class="metric-row">
                <article class="metric-card"><span>年度旅行次数</span><strong id="travelYearCount">0</strong></article>
                <article class="metric-card"><span>年度旅行费用</span><strong class="money-text" id="travelYearTotal">¥0</strong></article>
                <article class="metric-card"><span>全部旅行次数</span><strong id="travelCount">0</strong></article>
              </div>
              <article class="panel">
                <div class="panel-title">
                  <h3>年度旅行成本</h3>
                  <select id="travelYearFilter" aria-label="筛选旅行年份"><option value="all">全部年份</option></select>
                </div>
                <div id="travelYearChart" class="asset-bars"></div>
              </article>
              <article class="panel">
                <div class="panel-title">
                  <h3>旅行时间线</h3>
                  <input class="inline-search" id="travelSearch" type="search" placeholder="搜索目的地、攻略、回忆" />
                </div>
                <div class="timeline" id="timeline"></div>
              </article>
            </section>
          </section>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
